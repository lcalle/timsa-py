[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timsa"
version = "0.1.0"
description = "Tidal Inundation Model of Shallow-water Availability"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "L. Calle", email = "leo@calleecology.com" }]
keywords = ["tides", "inundation", "bathymetry", "coastal-ecology", "NOAA"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "requests>=2.28",
]

[project.optional-dependencies]
# Raster I/O and data acquisition. The core simulation runs without these.
geo = ["rasterio>=1.3", "scipy>=1.10", "pyproj>=3.5", "geopandas>=0.13", "shapely>=2.0"]
solar = ["astral>=3.2"]
io = ["pyarrow>=12.0"]
dev = ["pytest>=7.0", "pytest-cov"]
all = ["timsa[geo,solar,io,dev]"]

[project.urls]
Homepage = "https://github.com/lcalle/timsa-py"
"C reference" = "https://github.com/lcalle/timsa"

[project.scripts]
timsa = "timsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
